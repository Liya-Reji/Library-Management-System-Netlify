# Netlify Configuration for Library Management System
# Pure Netlify Architecture: Netlify Edge CDN (Frontend) + Netlify Serverless Functions (Backend)

[build]
  publish = "public"
  functions = "netlify/functions"
  command = "python scripts/prepare_netlify.py"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Route all API endpoints directly to the Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Route all frontend views and paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
