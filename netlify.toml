# Netlify Configuration for Library Management System
# Edge Proxy Architecture: Netlify Edge CDN -> Render Flask Backend

[build]
  publish = "static"
  command = "python scripts/prepare_netlify.py"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Default redirects (also dynamically generated by scripts/prepare_netlify.py based on BACKEND_URL)
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "https://library-management-system.onrender.com/:splat"
  status = 200
  force = true
