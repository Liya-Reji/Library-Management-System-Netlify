apiVersion: v1
kind: ConfigMap
metadata:
  name: library-app-config
  labels:
    app: library-management
data:
  FLASK_ENV: "production"
  PORT: "5000"
  DEFAULT_LOAN_DAYS: "14"
  SESSION_COOKIE_SECURE: "false"
  POSTGRES_DB: "library_db"
  POSTGRES_HOST: "library-postgres-service"
  POSTGRES_PORT: "5432"
