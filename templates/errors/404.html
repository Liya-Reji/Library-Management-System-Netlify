{% extends "base.html" %}
{% block title %}Error 404 - Page Not Found{% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card p-5 shadow-sm">
            <h1 class="display-3 text-secondary fw-bold">404</h1>
            <h4 class="mb-3">Page Not Found</h4>
            <p class="text-muted">The resource or page you are looking for does not exist or has been moved.</p>
            <div class="mt-4">
                <a href="{{ url_for('public.index') }}" class="btn btn-primary"><i class="bi bi-house"></i> Return Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
