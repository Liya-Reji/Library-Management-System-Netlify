{% extends "base.html" %}
{% block title %}Error 400 - Bad Request{% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card p-5 shadow-sm">
            <h1 class="display-3 text-warning fw-bold">400</h1>
            <h4 class="mb-3">Bad Request</h4>
            <p class="text-muted">{{ message or 'Your request could not be processed, possibly due to an expired or missing security token.' }}</p>
            <div class="mt-4">
                <a href="{{ url_for('public.index') }}" class="btn btn-primary"><i class="bi bi-house"></i> Return Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
