{% extends "base.html" %}
{% block title %}Error 500 - Internal Server Error{% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card p-5 shadow-sm">
            <h1 class="display-3 text-danger fw-bold">500</h1>
            <h4 class="mb-3">Internal Server Error</h4>
            <p class="text-muted">An unexpected server error occurred. Our team has been notified. Please try again later.</p>
            <div class="mt-4">
                <a href="{{ url_for('public.index') }}" class="btn btn-primary"><i class="bi bi-house"></i> Return Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
