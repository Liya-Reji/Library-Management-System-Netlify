{% extends "base.html" %}
{% block title %}Error 403 - Forbidden{% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card p-5 shadow-sm">
            <h1 class="display-3 text-danger fw-bold"><i class="bi bi-shield-lock"></i> 403</h1>
            <h4 class="mb-3">Access Denied</h4>
            <p class="text-muted">{{ message or 'You do not have the required role or permissions to access this page.' }}</p>
            <div class="mt-4">
                <a href="{{ url_for('public.index') }}" class="btn btn-primary"><i class="bi bi-house"></i> Return Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
