
{% extends "base.html" %}

{% block title %}Sign In - Library Management System{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">

            <!-- Login Header -->
            <div class="card-header bg-primary text-white text-center py-4 rounded-top">
                <i class="bi bi-person-circle display-5"></i>
                <h4 class="mt-2 mb-0 fw-bold">Sign In</h4>
                <small class="text-light opacity-75">
                    Access Librarian or Student Portal
                </small>
            </div>

            <div class="card-body p-4">

                <!-- Login Form -->
                <form method="POST"
                      action="{{ url_for('auth.login', next=request.args.get('next', '')) }}">

                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <!-- Username or Email -->
                    <div class="mb-3">
                        <label for="identifier" class="form-label fw-semibold">
                            Username or Email
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input
                                type="text"
                                class="form-control"
                                id="identifier"
                                name="identifier"
                                value="{{ identifier or '' }}"
                                required
                                autofocus
                                placeholder="Enter your username or email">
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">
                            Password
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-key"></i>
                            </span>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                required
                                placeholder="Enter your password">
                        </div>
                    </div>

                    <!-- Sign In Button -->
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit"
                                class="btn btn-primary py-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i>
                            Sign In
                        </button>
                    </div>

                </form>

            </div>

            <!-- Student Registration -->
            <div class="card-footer bg-light text-center py-3">
                <small class="text-muted">
                    Don't have a student account?
                    <a href="{{ url_for('auth.register') }}"
                       class="fw-semibold text-primary">
                        Register here
                    </a>
                </small>
            </div>

        </div>
    </div>
</div>
{% endblock %}
